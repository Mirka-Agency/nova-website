<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../src/CMS.Web/wwwroot/site/css/site-modules.css" />
  <style>
    body { margin: 0; font-family: Tahoma, sans-serif; line-height: 2; }
    .pad { height: 120vh; background: #f5f5f5; }
    .blog-prose { max-width: 40rem; margin: 0 auto; padding: 2rem; font-size: 1.25rem; color: #1a3a3f; }
  </style>
</head>
<body>
  <div class="pad">اسکرول کنید ↓</div>
  <div class="blog-prose">
    <p>
      متن عادی قبل.
      <span
        class="nova-scroll-highlight"
        data-nova-scroll-highlight="1"
        data-nova-sh-from="#9ca3af"
        data-nova-sh-to="#09707d"
        style="color:#9ca3af"
        >جراحی تیروئید یکی از مهم‌ترین روش‌های درمان بیماری‌های غدد است و این جمله باید با اسکرول رنگ عوض کند.</span
      >
      متن عادی بعد.
    </p>
  </div>
  <div class="pad">پایین صفحه</div>

  <script src="../src/CMS.Web/wwwroot/site/vendor/gsap/gsap.min.js"></script>
  <script src="../src/CMS.Web/wwwroot/site/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../src/CMS.Web/wwwroot/site/js/scroll-highlight.js"></script>
  <script>
    window.__FE_SH__ = { ready: false };
    window.addEventListener("load", function () {
      setTimeout(function () {
        var el = document.querySelector(".nova-scroll-highlight");
        window.__FE_SH__ = {
          ready: el && el.getAttribute("data-nova-sh-ready") === "1",
          hasCharSpans: el ? el.querySelectorAll(".nova-sh-char").length : -1,
          progress: el ? el.getAttribute("data-nova-sh-progress") : null,
          bg: el ? getComputedStyle(el).backgroundImage : null,
          color: el ? getComputedStyle(el).color : null,
          clip: el ? getComputedStyle(el).webkitBackgroundClip || getComputedStyle(el).backgroundClip : null,
          text: el ? el.textContent : null,
        };
      }, 200);
    });
  </script>
</body>
</html>
