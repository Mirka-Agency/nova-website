<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../src/CMS.Web/wwwroot/site/css/site-modules.css" />
  <style>
    body { margin: 0; font-family: Tahoma, sans-serif; line-height: 2; }
    .pad { height: 120vh; background: #f5f5f5; }
    .blog-prose { max-width: 40rem; margin: 0 auto; padding: 2rem; font-size: 1.25rem; color: #1a3a3f; }
  </style>
</head>
<body>
  <div class="pad">اسکرول کنید ↓</div>
  <div class="blog-prose">
    <p>
      متن عادی قبل.
      <span
        class="scroll-scrub-highlight"
        data-scroll-scrub-color="#e7f2b0"
        >جراحی تیروئید یکی از مهم‌ترین روش‌های درمان بیماری‌های غدد است و این جمله باید خط‌به‌خط هایلایت شود.</span
      >
      متن عادی بعد.
      همچنین <mark class="marker-yellow">هایلایت استاتیک زرد</mark> جدا بماند.
    </p>
  </div>
  <div class="pad">پایین صفحه</div>

  <script src="../src/CMS.Web/wwwroot/site/js/scroll-scrub-highlight.js"></script>
  <script>
    window.__FE_SH__ = { ready: false };
    window.addEventListener("load", function () {
      setTimeout(function () {
        var el = document.querySelector(".scroll-scrub-highlight");
        window.__FE_SH__ = {
          ready: el && el.getAttribute("data-scroll-scrub-ready") === "1",
          words: el ? el.querySelectorAll(".scroll-scrub-word").length : -1,
          lines: el ? el.querySelectorAll(".scroll-scrub-line").length : -1,
          color: el ? el.getAttribute("data-scroll-scrub-color") : null,
          text: el ? el.textContent : null,
        };
      }, 200);
    });
  </script>
</body>
</html>
