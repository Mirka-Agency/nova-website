services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mirka_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mirka_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  whatsapp:
    build:
      context: ./services/whatsapp-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
      PORT: "3100"
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-change-me-whatsapp-api-key}
      WHATSAPP_AUTH_PATH: /data/wwebjs_auth
      WHATSAPP_CLIENT_ID: ${WHATSAPP_CLIENT_ID:-cms-whatsapp}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - whatsapp_auth:/data/wwebjs_auth
    # Bind to loopback only so the service is not publicly reachable on the host.
    ports:
      - "127.0.0.1:${WHATSAPP_HTTP_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp:
        condition: service_started
    ports:
      - "${CMS_HTTP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Tehran
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mirka_cms;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Cache__RedisConnectionString: redis:6379
      Database__MigrateOnStartup: "true"
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-admin@local.test}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-Admin123!}
      Seed__Admin__FullName: ${SEED_ADMIN_FULLNAME:-مدیر سیستم}
      Storage__S3__AccessKey: ${STORAGE_S3_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${STORAGE_S3_SECRET_KEY:-}
      Storage__S3__BucketName: ${STORAGE_S3_BUCKET_NAME:-}
      Storage__S3__Region: ${STORAGE_S3_REGION:-us-east-1}
      Storage__S3__ServiceUrl: ${STORAGE_S3_SERVICE_URL:-}
      Storage__S3__PublicBaseUrl: ${STORAGE_S3_PUBLIC_BASE_URL:-}
      Storage__S3__ForcePathStyle: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WhatsApp__ServiceBaseUrl: http://whatsapp:3100
      WhatsApp__ApiKey: ${WHATSAPP_API_KEY:-change-me-whatsapp-api-key}
      WhatsApp__TimeoutSeconds: "45"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  cms_pgdata:
  whatsapp_auth:
